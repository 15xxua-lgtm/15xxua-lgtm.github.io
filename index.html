
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gallery</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  text-align: center;
  padding: 55px 20px 30px;
}

header h1 {
  font-size: 38px;
  margin-bottom: 10px;
}

header p {
  color: #999;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 18px;
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}

.photo {
  overflow: hidden;
  border-radius: 12px;
  background: #1c1c24;
}

.gallery img {
  display: block;
  width: 100%;
  height: 280px;
  object-fit: cover;
  cursor: pointer;
  transition: transform .3s;
}

.gallery img:hover {
  transform: scale(1.04);
}

#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.92);
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 10;
}

#viewer img {
  max-width: 95%;
  max-height: 90%;
  object-fit: contain;
}

#viewer span {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 40px;
  cursor: pointer;
}

footer {
  text-align: center;
  color: #666;
  padding: 35px;
}
</style>
</head>

<body>

<header>
  <h1>Menim Gunlerim</h1>
  <p>Ulfat Abbasov. 1977. Gedebey.</p>
</header>

<div class="gallery">

  <div class="photo">
    <img src="b103f902-8b99-4449-861c-fad8776b61d3.jpg"
         alt="My photo" onclick="openPhoto(this)">
  </div>
    <div class="photo">
    <img src="36477e68-5706-438f-89e3-bc528b2f402c.jpg"
         alt="My photo" onclick="openPhoto(this)">
  </div>
    <div class="photo">
    <img src="e684806d-b106-4545-90cc-8692a6113afb.jpg"
         alt="My photo" onclick="openPhoto(this)">
  </div>

  <div class="photo">
    <img src="e74de773-4dce-4f77-8a17-ad16de0a1440.jpg"
         alt="My photo" onclick="openPhoto(this)">
  </div>

  <div class="photo">
    <img src="https://picsum.photos/id/1011/600/600"
         alt="Gallery photo" onclick="openPhoto(this)">
  </div>

  <div class="photo">
    <img src="https://picsum.photos/id/1015/600/600"
         alt="Gallery photo" onclick="openPhoto(this)">
  </div>

  <div class="photo">
    <img src="https://picsum.photos/id/1016/600/600"
         alt="Gallery photo" onclick="openPhoto(this)">
  </div>

  <div class="photo">
    <img src="https://picsum.photos/id/1025/600/600"
         alt="Gallery photo" onclick="openPhoto(this)">
  </div>

  <div class="photo">
    <img src="https://picsum.photos/id/1035/600/600"
         alt="Gallery photo" onclick="openPhoto(this)">
  </div>

  <div class="photo">
    <img src="https://picsum.photos/id/1043/600/600"
         alt="Gallery photo" onclick="openPhoto(this)">
  </div>

</div>

<div id="viewer" onclick="closePhoto()">
  <span>&times;</span>
  <img id="bigPhoto" alt="Enlarged photo">
</div>

<footer>© 2026 My Gallery</footer>

<script>
function openPhoto(img) {
  document.getElementById('bigPhoto').src = img.src;
  document.getElementById('viewer').style.display = 'flex';
}

function closePhoto() {
  document.getElementById('viewer').style.display = 'none';
}
</script>

</body>
</html>
