
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gallery</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #101014;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  text-align: center;
  padding: 55px 20px 30px;
}
header h1 {
  font-size: 38px;
  margin-bottom: 10px;
}
header p { color: #999; }
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
  padding: 20px;
  max-width: 1200px;
  margin: auto;
}
.gallery img {
  width: 100%;
  height: 280px;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  transition: .3s;
}
.gallery img:hover { transform: scale(1.03); }
#viewer {
  display: none;
  position: fixed;
  inset: 0;
  background: #000e;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
#viewer img {
  max-width: 95%;
  max-height: 90%;
  object-fit: contain;
}
#viewer span {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 35px;
  cursor: pointer;
}
footer {
  text-align: center;
  color: #666;
  padding: 35px;
}
</style>
</head>
<body>

<header>
  <h1>My Gallery</h1>
  <p>My memories. My moments. My world.</p>
</header>

<div class="gallery">
  <img src="b103f902-8b99-4449-861c-fad8776b61d3.jpg" onclick="openPhoto(this)">
  <img src="https://picsum.photos/id/1011/600/600" onclick="openPhoto(this)">
  <img src="https://picsum.photos/id/1015/600/600" onclick="openPhoto(this)">
  <img src="https://picsum.photos/id/1016/600/600" onclick="openPhoto(this)">
  <img src="https://picsum.photos/id/1025/600/600" onclick="openPhoto(this)">
  <img src="https://picsum.photos/id/1035/600/600" onclick="openPhoto(this)">
  <img src="https://picsum.photos/id/1043/600/600" onclick="openPhoto(this)">
</div>

<div id="viewer" onclick="closePhoto()">
  <span>&times;</span>
  <img id="bigPhoto">
</div>

<footer>© 2026 My Gallery</footer>

<script>
function openPhoto(img) {
  document.getElementById('bigPhoto').src = img.src;
  document.getElementById('viewer').style.display = 'flex';
}
function closePhoto() {
  document.getElementById('viewer').style.display = 'none';
}
</script>

</body>
</html>
